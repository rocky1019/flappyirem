<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Friend</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:linear-gradient(#59c9ff,#b9f1ff);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.game{
width:100%;
max-width:420px;
height:100vh;
position:relative;
}

canvas{
width:100%;
height:100%;
}

/* start text */

.startText{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:28px;
color:white;
font-weight:bold;
text-shadow:0 4px 10px rgba(0,0,0,0.4);
animation:pulse 1.2s infinite;
}

@keyframes pulse{
0%{opacity:1;}
50%{opacity:0.4;}
100%{opacity:1;}
}

/* scores */

.score{
position:absolute;
font-size:22px;
font-weight:bold;
color:white;
text-shadow:0 4px 10px rgba(0,0,0,0.4);
}

#highscore{
left:10px;
top:20px;
}

#currentscore{
top:20px;
left:50%;
transform:translateX(-50%);
font-size:28px;
}

#fpoints{
right:10px;
top:20px;
}

/* game over */

.gameover{
position:absolute;
top:45%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
display:none;
}

.gameover img{
width:180px;
margin-bottom:10px;
}

.gameover h2{
color:white;
font-size:36px;
margin-bottom:10px;
}

.btn{
padding:12px 24px;
margin:5px;
border:none;
border-radius:30px;
font-size:18px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(#ffb300,#ff6f00);
color:white;
}

/* coin display */

.coinbox{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
text-align:center;
display:none;
}

.coinbox img{
width:140px;
opacity:0.9;
}

.coinbox h1{
position:absolute;
top:25%;
left:50%;
transform:translate(-50%,-50%);
font-size:42px;
color:white;
text-shadow:0 5px 10px black;
}

/* ADDED jumpscare screen */

#jumpscare{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

#jumpscare img{
width:100%;
height:100%;
object-fit:cover;
}
/* Jumpscare effects */

#jumpscare{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
justify-content:center;
align-items:center;
z-index:999;
overflow:hidden;
}

#jumpscare img{
width:100%;
height:100%;
object-fit:cover;
animation:shake 0.1s infinite, flash 0.2s infinite;
filter:blur(2px) contrast(140%) brightness(120%);
}

/* screen shake */

@keyframes shake{
0%{transform:translate(0,0);}
25%{transform:translate(-10px,8px);}
50%{transform:translate(8px,-10px);}
75%{transform:translate(-8px,6px);}
100%{transform:translate(10px,-8px);}
}

/* flashing light */

@keyframes flash{
0%{filter:brightness(1.5) contrast(2);}
50%{filter:brightness(0.5) contrast(1);}
100%{filter:brightness(1.8) contrast(2);}
}
</style>

</head>

<body>

<div class="game">

<div id="highscore" class="score">High: 0</div>
<div id="currentscore" class="score">0</div>
<div id="fpoints" class="score">Furry Points: 0</div>

<div id="startText" class="startText">Tap Screen To Start</div>

<canvas id="gameCanvas"></canvas>

<div class="gameover" id="gameover">
<img src="gameover.png">
<h2>Game Over</h2>
<button class="btn" onclick="restartGame()">Restart</button>
<button class="btn" onclick="goHome()">Home</button>

<!-- ADDED button -->

<button class="btn" onclick="surpriseMe()">Surprise Me</button>

</div>

<div class="coinbox" id="coinbox">
<img src="fcoins.png">
<h1 id="finalcoins">0</h1>
</div>

</div>

<!-- ADDED jumpscare elements -->

<div id="jumpscare">
<img src="gameover.png">
</div>

<audio id="screamSound" src="scream.mp3"></audio>

<script>

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

canvas.width=400;
canvas.height=700;

/* physics */

let birdY=300;
let velocity=0;

const gravity=0.5;
const jumpPower=-8;

/* game state */

let gameStarted=false;

/* game data */

let pipes=[];
let coins=[];
let score=0;
let fpoints=0;
let gameOver=false;
let pipeSpeed=2;

/* images */

const bird=new Image();
bird.src="avatar.png";

/* highscore */

let highScore=localStorage.getItem("flappyHigh");

if(!highScore){
highScore=0;
}

document.getElementById("highscore").innerText="High: "+highScore;

/* controls */

document.addEventListener("click",flap);
document.addEventListener("keydown",e=>{
if(e.code==="Space") flap();
});

function flap(){

if(!gameStarted){
gameStarted=true;
document.getElementById("startText").style.display="none";
return;
}

if(gameOver) return;

velocity=jumpPower;

}

/* spawn pipes */

function spawnPipe(){

let gap=170;

let topHeight=Math.random()*250+80;

pipes.push({
x:canvas.width,
top:topHeight,
bottom:topHeight+gap,
passed:false
});

/* coin */

coins.push({
x:canvas.width+30,
y:topHeight+gap/2
});

}

setInterval(spawnPipe,1800);

/* update */

function update(){

if(!gameStarted || gameOver) return;

pipeSpeed=2+score*0.05;

velocity+=gravity;
birdY+=velocity;

if(birdY<0||birdY>canvas.height){
endGame();
}

/* pipes */

pipes.forEach(pipe=>{

pipe.x-=pipeSpeed;

if(pipe.x<140&&pipe.x>80){

if(birdY<pipe.top||birdY>pipe.bottom){
endGame();
}

}

if(!pipe.passed && pipe.x<100){

pipe.passed=true;

score++;
fpoints+=5;

updateUI();

}

});

/* coins */

coins.forEach((coin,i)=>{

coin.x-=pipeSpeed;

if(
coin.x<120&&coin.x>80 &&
birdY<coin.y+20 &&
birdY+50>coin.y
){

fpoints+=10;

coins.splice(i,1);

updateUI();

}

});

}

/* draw */

let birdSize=55;

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

/* gradient pipes */

pipes.forEach(pipe=>{

let grad=ctx.createLinearGradient(pipe.x,0,pipe.x+60,0);
grad.addColorStop(0,"#2ecc71");
grad.addColorStop(1,"#1e8f4c");

ctx.fillStyle=grad;

ctx.fillRect(pipe.x,0,60,pipe.top);
ctx.fillRect(pipe.x,pipe.bottom,60,canvas.height);

});

/* coins */

coins.forEach(coin=>{

ctx.fillStyle="gold";
ctx.beginPath();
ctx.arc(coin.x,coin.y,10,0,Math.PI*2);
ctx.fill();

});

/* bird */

let rotation=velocity*0.05;

ctx.save();

ctx.translate(100,birdY+25);
ctx.rotate(rotation);

ctx.drawImage(bird,-28,-28,birdSize,birdSize);

ctx.restore();

}

/* loop */

function loop(){

update();
draw();
requestAnimationFrame(loop);

}

loop();

/* update UI */

function updateUI(){

document.getElementById("currentscore").innerText=score;
document.getElementById("fpoints").innerText="Furry Points: "+fpoints;

if(score>highScore){

highScore=score;

localStorage.setItem("flappyHigh",highScore);

document.getElementById("highscore").innerText="High: "+highScore;

}

}

/* game over */

function endGame(){

gameOver=true;

document.getElementById("gameover").style.display="block";

document.getElementById("coinbox").style.display="block";

document.getElementById("finalcoins").innerText=fpoints;

}

/* restart */

function restartGame(){
location.reload();
}

function goHome(){
window.location.href="index.html";
}

function surpriseMe(){

let scare=document.getElementById("jumpscare");
let sound=document.getElementById("screamSound");

scare.style.display="flex";

sound.currentTime=0;
sound.volume=1;
sound.play();

/* body shake */

document.body.style.animation="shake 0.15s infinite";

/* stop shake after scare */

setTimeout(()=>{
document.body.style.animation="none";
},3000);

/* go to home page after scare */

setTimeout(()=>{
window.location.href="index.html";
},4000);

}

</script>

</body>
</html>
